<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Espace Gestion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- LOGIN MODAL -->
  <div id="login-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md text-center space-y-6">
      <div class="w-16 h-16 bg-sky-500/10 text-sky-400 rounded-2xl flex items-center justify-center mx-auto text-2xl"><i class="fa-solid fa-lock"></i></div>
      <h2 class="text-2xl font-bold text-white">Espace Admin Apex</h2>
      <p class="text-xs text-slate-400">Ampidiro ny teny miafina mba hidirana (Default: 1234)</p>
      <input type="password" id="adminPass" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-center text-white focus:outline-none focus:border-sky-400" placeholder="****">
      <button onclick="checkAdminAuth()" class="w-full py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl transition">Hiditra</button>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="admin-dashboard" class="hidden min-h-screen flex flex-col">
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 flex justify-between items-center">
      <span class="font-bold text-lg text-white">Apex Solutions - Dashboard Admin</span>
      <div class="flex gap-4 items-center">
        <a href="index.html" class="text-xs text-sky-400 hover:underline"><i class="fa-solid fa-globe"></i> Hijery ny site</a>
        <button onclick="logoutAdmin()" class="px-3 py-1 bg-red-500/20 text-red-400 text-xs rounded-lg border border-red-500/30">Hivoaka</button>
      </div>
    </header>

    <div class="max-w-7xl mx-auto w-full p-6 space-y-8 flex-grow">
      <!-- ADD SERVICE / PRODUCT SECTION -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
        <h3 class="text-xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-plus text-sky-400"></i> Hanampy Serivisy Vaovao</h3>
        <form id="add-service-form" class="grid md:grid-cols-2 gap-4">
          <input type="text" id="servTitle" placeholder="Anaran'ny tolotra / Serivisy" required class="px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400">
          <input type="text" id="servPrice" placeholder="Sarasara / Vidiny (ex: 150 000 Ar)" required class="px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400">
          <textarea id="servDesc" placeholder="Mombamomba ny serivisy..." required class="md:col-span-2 px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400"></textarea>
          
          <div>
            <label class="block text-xs text-slate-400 mb-1">URL Sary Unsplash na hampiditra rakitra</label>
            <input type="text" id="servImgUrl" placeholder="https://images.unsplash.com/..." class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-sky-400">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Na hampiditra sary avy amin'ny PC (Compress Canvas)</label>
            <input type="file" id="servImgFile" accept="image/*" class="w-full text-xs text-slate-400">
          </div>

          <button type="submit" class="md:col-span-2 py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl transition">Tehirizina ao amin'ny Site</button>
        </form>
      </div>

      <!-- LIST OF SERVICES -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
        <h3 class="text-xl font-bold text-white">Ireo Serivisy Efa Misy</h3>
        <div id="admin-services-list" class="grid md:grid-cols-3 gap-4">
          <!-- Dynamic list -->
        </div>
      </div>

      <!-- MESSAGES RECEIVED -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
        <h3 class="text-xl font-bold text-white">Boîte de Réception - Hafatra Azo</h3>
        <div id="admin-messages-list" class="space-y-3">
          <!-- Dynamic messages -->
        </div>
      </div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
